<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1E2430">
<title>개미 대본실</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<link rel="icon" href="assets/icon-192.png">
<style>
:root{
  --ink:#26221C; --sub:#7A7266; --cream:#F7F2E9; --card:#FFFFFF;
  --accent:#E5493D; --accent-dark:#C93A2F; --navy:#1E2430;
  --chat-bg:#C7D2DE; --bubble-fire:#FFE0DA; --bubble-worker:#FFFFFF;
  --line:#E5DDD0;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{font-family:"Apple SD Gothic Neo","Pretendard",-apple-system,BlinkMacSystemFont,"Malgun Gothic",sans-serif;background:var(--cream);color:var(--ink);}
button{font-family:inherit;cursor:pointer;border:none;background:none;padding:0}
textarea,input{font-family:inherit}
#app{height:100%;display:flex;flex-direction:column}

/* ---------- 잠금 화면 ---------- */
.lock{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--navy);color:#fff;padding:24px;gap:18px}
.lock .ants{display:flex;gap:4px}
.lock .ants img{width:96px;height:96px;object-fit:contain;filter:drop-shadow(0 6px 14px rgba(0,0,0,.45))}
.lock h1{font-size:22px;margin:0;letter-spacing:1px}
.lock p{margin:0;color:#9AA3B2;font-size:13px}
.pin{display:flex;gap:14px;margin-top:6px}
.pin i{width:16px;height:16px;border-radius:50%;border:2px solid #5A6478;transition:all .15s}
.pin i.on{background:var(--accent);border-color:var(--accent)}
#pinInput{position:absolute;opacity:0;pointer-events:none}
.keypad{display:grid;grid-template-columns:repeat(3,72px);gap:12px;margin-top:8px}
.keypad button{height:60px;border-radius:16px;background:#2B3342;color:#fff;font-size:24px;font-weight:600;transition:background .1s}
.keypad button:active{background:#3A4356}
.keypad button.ghost{background:transparent;color:#9AA3B2;font-size:15px}
.lock .err{color:#FF8A80;font-size:13px;height:18px}
.shake{animation:shake .35s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}

/* ---------- 공통 헤더 ---------- */
.top{position:sticky;top:0;z-index:10;background:var(--navy);color:#fff;display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 10px) 14px 10px}
.top .ants img{width:34px;height:34px;object-fit:contain;vertical-align:middle}
.top .ttl{font-size:17px;font-weight:700;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top .back{color:#fff;font-size:22px;padding:4px 8px 4px 0}
.top .edit-title{color:#9AA3B2;font-size:15px;padding:4px 6px}
.top .del-post{color:#9AA3B2;font-size:15px;padding:4px 6px}
.modal .btns .danger{background:#C93A2F;color:#fff}
.status{font-size:11px;color:#9AA3B2;white-space:nowrap}
.bell{font-size:19px;padding:4px 8px;opacity:.45;filter:grayscale(1);transition:all .15s}
.bell.on{opacity:1;filter:none}
.status.saving{color:#FFD54F}.status.error{color:#FF8A80}.status.saved{color:#81C784}

/* ---------- 게시판 ---------- */
.board{flex:1;overflow-y:auto;padding:16px 14px calc(env(safe-area-inset-bottom) + 90px);
  background-color:#14201B;
  background-image:url('assets/board-bg.jpg');
  background-position:center;background-size:cover;background-repeat:no-repeat;background-attachment:fixed}
@supports (-webkit-touch-callout: none){.board{background-attachment:scroll}}
.board .hint{color:#EAF4EE;font-size:13px;text-align:center;margin-top:40px;line-height:1.7;text-shadow:0 1px 4px rgba(0,0,0,.8)}
.card{background:rgba(23,48,40,.92);border:1px solid #2E5C4C;border-radius:16px;padding:14px 16px;margin-bottom:12px;display:block;width:100%;text-align:left;box-shadow:0 2px 10px rgba(0,0,0,.35)}
.card:active{transform:scale(.99);background:rgba(30,61,50,.95)}
.card .t{font-size:16px;font-weight:700;margin-bottom:6px;display:flex;align-items:center;gap:8px;color:#EAF4EE}
.card .pv{font-size:13px;color:#A8C5B6;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-bottom:8px}
.card .meta{font-size:12px;color:#7FA391;display:flex;gap:10px}
.fab{position:fixed;right:18px;bottom:calc(env(safe-area-inset-bottom) + 20px);background:var(--accent);color:#fff;font-size:15px;font-weight:700;padding:14px 20px;border-radius:28px;box-shadow:0 4px 14px rgba(229,73,61,.4);z-index:20}
.fab:active{background:var(--accent-dark)}

/* ---------- 채팅 ---------- */
.chat{flex:1;overflow-y:auto;padding:14px 12px 8px;overscroll-behavior:contain;
  background-color:var(--chat-bg);
  background-image:linear-gradient(rgba(0,0,0,.5),rgba(0,0,0,.5)),url('assets/chat-bg.jpg');
  background-position:center;background-size:cover;background-repeat:no-repeat;background-attachment:fixed}
@supports (-webkit-touch-callout: none){.chat{background-attachment:scroll}}
.day{display:flex;justify-content:center;margin:14px 0 10px}
.day span{background:rgba(20,24,32,.6);color:#fff;font-size:11px;padding:4px 12px;border-radius:12px}
.row{display:flex;gap:8px;margin-bottom:12px;align-items:flex-start}
.row.fire{flex-direction:row-reverse}
.avatar{width:38px;height:38px;border-radius:50%;background:#fff;object-fit:contain;padding:2px;flex-shrink:0;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.mcol{max-width:76%;display:flex;flex-direction:column}
.row.fire .mcol{align-items:flex-end}
.who{font-size:11.5px;color:#E8ECF2;margin:0 2px 3px;text-shadow:0 1px 3px rgba(0,0,0,.7)}
.bwrap{display:flex;align-items:flex-end;gap:6px}
.row.fire .bwrap{flex-direction:row-reverse}
.bubble{background:var(--bubble-worker);border-radius:4px 14px 14px 14px;padding:9px 12px;font-size:14.5px;line-height:1.55;white-space:pre-wrap;word-break:break-word;box-shadow:0 1px 2px rgba(0,0,0,.1)}
.row.fire .bubble{background:var(--bubble-fire);border-radius:14px 4px 14px 14px}
.tstamp{font-size:10.5px;color:#DCE2EA;flex-shrink:0;padding-bottom:2px;text-shadow:0 1px 3px rgba(0,0,0,.7)}
.edited{font-size:10px;color:#C4CBD6;margin:2px 4px 0;text-shadow:0 1px 3px rgba(0,0,0,.7)}
.gone{display:flex;justify-content:center;margin-bottom:12px}
.gone button{background:rgba(20,24,32,.55);color:#D5DBE4;font-size:12px;padding:6px 14px;border-radius:14px}
.actions{display:flex;gap:6px;margin-top:6px}
.actions button{background:rgba(30,36,48,.75);color:#fff;font-size:12px;padding:6px 12px;border-radius:10px}
.actions button.danger{background:rgba(201,58,47,.85)}
.editbox{width:100%;min-width:220px}
.editbox textarea{width:100%;border:2px solid var(--accent);border-radius:12px;padding:9px 12px;font-size:14.5px;line-height:1.55;resize:vertical;min-height:60px;background:#fff}
.editbox .actions button.ok{background:var(--accent)}

/* ---------- 입력창 ---------- */
.composer{background:#fff;border-top:1px solid #D8DEE6;padding:8px 10px calc(env(safe-area-inset-bottom) + 8px);display:flex;align-items:flex-end;gap:8px}
.roles{display:flex;gap:6px;padding-bottom:2px}
.roles button{width:44px;height:44px;border-radius:50%;padding:3px;border:3px solid transparent;opacity:.45;transition:all .15s;background:#F1EDE5}
.roles button img{width:100%;height:100%;object-fit:contain}
.roles button.on{opacity:1;border-color:var(--accent);background:#fff;transform:scale(1.05)}
#msgInput{flex:1;border:1px solid #D8DEE6;border-radius:20px;padding:10px 14px;font-size:15px;line-height:1.45;resize:none;max-height:132px;background:#F7F8FA;outline:none}
#msgInput:focus{border-color:var(--accent)}
.send{width:44px;height:44px;border-radius:50%;background:var(--accent);color:#fff;font-size:18px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.send:disabled{background:#D3CCC0}
.send:active:not(:disabled){background:var(--accent-dark)}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 100px);background:rgba(30,36,48,.92);color:#fff;font-size:13px;padding:10px 18px;border-radius:20px;z-index:50;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.show{opacity:1}

/* ---------- 입력 모달 ---------- */
.modal-bg{position:fixed;inset:0;background:rgba(20,24,32,.55);z-index:100;display:flex;align-items:center;justify-content:center;padding:24px}
.modal{background:#fff;border-radius:18px;padding:20px;width:100%;max-width:360px;box-shadow:0 10px 40px rgba(0,0,0,.35)}
.modal h3{margin:0 0 14px;font-size:16px}
.modal input{width:100%;border:2px solid var(--line);border-radius:12px;padding:11px 14px;font-size:15px;outline:none}
.modal input:focus{border-color:var(--accent)}
.modal .btns{display:flex;gap:8px;margin-top:14px;justify-content:flex-end}
.modal .btns button{padding:10px 18px;border-radius:12px;font-size:14px;font-weight:600}
.modal .btns .ok{background:var(--accent);color:#fff}
.modal .btns .no{background:#EFEAE0;color:var(--ink)}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>
<script>
'use strict';
/* ================= 설정 ================= */
const CFG = {
  dataRepo: 'oogamecooo-byte/ant-studio-data',
  branch: 'main',
  api: 'https://api.github.com',
  vapidPublicKey: 'BB_i3L4fEw5QFlXLDbU-h3yQCGg-QInTNPJk6eANSkVBrOKUEPl7bc7oTOOGOtARsbAEBiRTLxF83-0AKgAqCDQ',
  roles: {
    worker: {name:'일개미', img:'assets/ant-worker.png'},
    fire:   {name:'불개미', img:'assets/ant-fire.png'}
  }
};
let TOKEN = sessionStorage.getItem('gh_t') || null;
let curPost = null;        // {path, data}
let editingId = null;      // 수정 중인 메시지 id (폴링 중단용)
let menuId = null;         // 액션 메뉴가 열린 메시지 id
let pollTimer = null;

/* ================= 유틸 ================= */
const $ = sel => document.querySelector(sel);
const app = document.getElementById('app');
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function b64encBytes(bytes){let s='';for(let i=0;i<bytes.length;i+=0x8000){s+=String.fromCharCode.apply(null,bytes.subarray(i,i+0x8000));}return btoa(s);}
function b64decBytes(b64){const bin=atob(String(b64).replace(/\s/g,''));const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u;}
const utf8enc = s => new TextEncoder().encode(s);
const utf8dec = b => new TextDecoder().decode(b);
const newId = () => Date.now().toString(36)+Math.random().toString(36).slice(2,7);
function deviceId(){let d=localStorage.getItem('antDev');if(!d){d=newId();localStorage.setItem('antDev',d);}return d;}
function urlB64ToUint8(s){const pad='='.repeat((4-s.length%4)%4);const b=(s+pad).replace(/-/g,'+').replace(/_/g,'/');const raw=atob(b);const u=new Uint8Array(raw.length);for(let i=0;i<raw.length;i++)u[i]=raw.charCodeAt(i);return u;}
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),2200);}
function fmtTime(iso){const d=new Date(iso);const h=d.getHours(),m=String(d.getMinutes()).padStart(2,'0');return (h<12?'오전 ':'오후 ')+((h%12)||12)+':'+m;}
function fmtDay(iso){const d=new Date(iso);return d.getFullYear()+'년 '+(d.getMonth()+1)+'월 '+d.getDate()+'일 '+['일','월','화','수','목','금','토'][d.getDay()]+'요일';}
function fmtRel(iso){const s=(Date.now()-new Date(iso).getTime())/1000;if(s<60)return'방금';if(s<3600)return Math.floor(s/60)+'분 전';if(s<86400)return Math.floor(s/3600)+'시간 전';if(s<172800)return'어제';const d=new Date(iso);return(d.getMonth()+1)+'월 '+d.getDate()+'일';}
function setStatus(kind,txt){const el=$('#status');if(!el)return;el.className='status '+kind;el.textContent=txt;}
/* prompt() 대체 — 환경 안 타는 자체 입력 모달 */
function askText(title, def){
  return new Promise(resolve=>{
    const bg=document.createElement('div');
    bg.className='modal-bg';
    bg.innerHTML=`<div class="modal"><h3>${esc(title)}</h3><input id="mdIn" value="${esc(def||'')}"><div class="btns"><button class="no">취소</button><button class="ok">확인</button></div></div>`;
    document.body.appendChild(bg);
    const inp=bg.querySelector('#mdIn');
    const done=v=>{bg.remove();resolve(v);};
    bg.querySelector('.ok').onclick=()=>done(inp.value);
    bg.querySelector('.no').onclick=()=>done(null);
    bg.addEventListener('click',e=>{if(e.target===bg)done(null);});
    inp.addEventListener('keydown',e=>{if(e.key==='Enter')done(inp.value);if(e.key==='Escape')done(null);});
    inp.focus();inp.select();
  });
}
/* 확인 모달 (삭제 등) */
function askConfirm(title, okLabel){
  return new Promise(resolve=>{
    const bg=document.createElement('div');
    bg.className='modal-bg';
    bg.innerHTML=`<div class="modal"><h3>${esc(title)}</h3><div class="btns"><button class="no">취소</button><button class="danger">${esc(okLabel||'삭제')}</button></div></div>`;
    document.body.appendChild(bg);
    const done=v=>{bg.remove();resolve(v);};
    bg.querySelector('.danger').onclick=()=>done(true);
    bg.querySelector('.no').onclick=()=>done(false);
    bg.addEventListener('click',e=>{if(e.target===bg)done(false);});
  });
}

/* ================= 잠금/암호 ================= */
async function unlock(pw){
  const cfg = await fetch('auth.enc.json?_='+Date.now(),{cache:'no-store'}).then(r=>r.json());
  if(!cfg || !cfg.ct) throw new Error('NOSETUP');
  const km = await crypto.subtle.importKey('raw', utf8enc(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey(
    {name:'PBKDF2', salt:b64decBytes(cfg.salt), iterations:cfg.iter||310000, hash:'SHA-256'},
    km, {name:'AES-GCM', length:256}, false, ['decrypt']);
  const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64decBytes(cfg.iv)}, key, b64decBytes(cfg.ct));
  TOKEN = utf8dec(new Uint8Array(pt)).trim();
  sessionStorage.setItem('gh_t', TOKEN);
}

/* ================= GitHub API ================= */
async function gh(path, opts={}){
  const r = await fetch(`${CFG.api}/repos/${CFG.dataRepo}/contents/${path}${opts.q||''}`,{
    method: opts.method||'GET', cache:'no-store',
    headers: Object.assign({Authorization:'Bearer '+TOKEN, Accept:'application/vnd.github+json'},
                           opts.body?{'Content-Type':'application/json'}:{}),
    body: opts.body?JSON.stringify(opts.body):undefined
  });
  if(r.status===401){sessionStorage.removeItem('gh_t');TOKEN=null;route();throw new Error('인증 만료');}
  return r;
}
async function getJson(path){
  const r = await gh(path,{q:'?ref='+CFG.branch+'&_='+Date.now()});
  if(r.status===404) return null;
  if(!r.ok) throw new Error('불러오기 실패 ('+r.status+')');
  const j = await r.json();
  return {data: JSON.parse(utf8dec(b64decBytes(j.content))), sha: j.sha};
}
async function putJson(path, data, sha, message){
  const body = {message, branch:CFG.branch, content:b64encBytes(utf8enc(JSON.stringify(data,null,1)))};
  if(sha) body.sha = sha;
  const r = await gh(path,{method:'PUT',body});
  if(r.status===409 || r.status===422) return false;
  if(!r.ok) throw new Error('저장 실패 ('+r.status+')');
  return true;
}
/* 충돌 시 최신본을 다시 받아 같은 변경을 재적용 */
async function mutate(path, fn, message, init){
  for(let i=0;i<4;i++){
    const cur = await getJson(path);
    let data;
    if(cur) data = cur.data;
    else if(init!==undefined) data = JSON.parse(JSON.stringify(init));
    else throw new Error('파일 없음: '+path);
    fn(data);
    if(await putJson(path, data, cur&&cur.sha, message)) return data;
    await new Promise(r=>setTimeout(r, 400+Math.random()*700));
  }
  throw new Error('저장 충돌: '+path);
}

/* ================= 데이터 작업 ================= */
const postPath = id => `data/posts/${id}.json`;
function previewOf(post){
  const live = post.messages.filter(m=>!m.deleted);
  if(!live.length) return '';
  const last = live[live.length-1];
  return (CFG.roles[last.role]?CFG.roles[last.role].name:'')+': '+last.text.replace(/\s+/g,' ').slice(0,48);
}
async function syncIndex(post){
  await mutate('data/index.json', d=>{
    d.posts = d.posts || [];
    let e = d.posts.find(p=>p.id===post.id);
    if(!e){e={id:post.id};d.posts.unshift(e);}
    e.title=post.title; e.created=post.created; e.updated=post.updated;
    e.count=post.messages.filter(m=>!m.deleted).length;
    e.preview=previewOf(post);
    d.posts.sort((a,b)=>(b.updated||'').localeCompare(a.updated||''));
  },'index: '+post.title,{posts:[]});
}
async function mutatePost(id, fn, msg){
  setStatus('saving','저장 중…');
  try{
    const data = await mutate(postPath(id), p=>{fn(p);p.updated=new Date().toISOString();}, msg);
    curPost = {id, data};
    await syncIndex(data).catch(()=>{});
    setStatus('saved','저장됨 ✓');
    return data;
  }catch(e){
    setStatus('error','저장 실패 — 다시 시도하세요');
    toast('저장에 실패했습니다: '+e.message);
    throw e;
  }
}

/* ================= 화면: 잠금 ================= */
function renderLock(msg){
  stopPoll();
  app.innerHTML = `
  <div class="lock" id="lockBox">
    <div class="ants"><img src="assets/ant-worker.png" alt="일개미"><img src="assets/ant-fire.png" alt="불개미"></div>
    <h1>개미 대본실</h1>
    <p>비밀번호 4자리를 입력하세요</p>
    <div class="pin" id="pinDots"><i></i><i></i><i></i><i></i></div>
    <div class="err" id="lockErr">${msg?esc(msg):''}</div>
    <div class="keypad" id="keypad">
      ${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-k="${n}">${n}</button>`).join('')}
      <button class="ghost"></button><button data-k="0">0</button><button class="ghost" data-k="del">지움</button>
    </div>
  </div>`;
  let pin='';
  const dots=[...document.querySelectorAll('#pinDots i')];
  const draw=()=>dots.forEach((d,i)=>d.classList.toggle('on',i<pin.length));
  $('#keypad').addEventListener('click', async e=>{
    const k=e.target.dataset.k; if(!k)return;
    if(k==='del'){pin=pin.slice(0,-1);draw();return;}
    if(pin.length>=4)return;
    pin+=k;draw();
    if(pin.length===4){
      $('#lockErr').textContent='확인 중…';
      try{ await unlock(pin); route(); }
      catch(err){
        pin='';draw();
        $('#lockBox').classList.add('shake');
        setTimeout(()=>$('#lockBox').classList.remove('shake'),400);
        $('#lockErr').textContent = err.message==='NOSETUP' ? '아직 토큰 설정이 안 됐습니다 (setup_token 실행 필요)' : '비밀번호가 틀렸습니다';
      }
    }
  });
}

/* ================= 화면: 게시판 ================= */
async function renderBoard(){
  stopPoll();
  curPost=null; editingId=null; menuId=null;
  app.innerHTML = `
  <div class="top">
    <span class="ants"><img src="assets/ant-worker.png" alt=""><img src="assets/ant-fire.png" alt=""></span>
    <div class="ttl">개미 대본실</div>
    <button class="bell" id="bellBtn" title="새 대사 알림">🔔</button>
    <span class="status" id="status"></span>
  </div>
  <div class="board" id="boardList"><div class="hint">불러오는 중…</div></div>
  <button class="fab" id="newBtn">＋ 새로 만들기</button>`;
  $('#newBtn').onclick = newPost;
  $('#bellBtn').onclick = toggleNotify;
  updateBell();
  try{
    const idx = await getJson('data/index.json');
    const posts = idx ? (idx.data.posts||[]) : [];
    $('#boardList').innerHTML = posts.length ? posts.map(p=>`
      <button class="card" data-id="${esc(p.id)}">
        <div class="t">📝 ${esc(p.title||'제목 없음')}</div>
        ${p.preview?`<div class="pv">${esc(p.preview)}</div>`:''}
        <div class="meta"><span>💬 ${p.count||0}개</span><span>${fmtRel(p.updated||p.created)}</span></div>
      </button>`).join('')
      : `<div class="hint">아직 대본이 없습니다.<br>오른쪽 아래 <b>[＋ 새로 만들기]</b>를 눌러<br>첫 대본을 시작하세요 🐜</div>`;
    $('#boardList').addEventListener('click', e=>{
      const c=e.target.closest('.card'); if(c) location.hash='#/p/'+c.dataset.id;
    });
  }catch(e){
    $('#boardList').innerHTML = `<div class="hint">목록을 불러오지 못했습니다.<br>${esc(e.message)}</div>`;
  }
}
async function newPost(){
  const d=new Date();
  const title = await askText('대본 제목을 입력하세요', d.getMonth()+1+'월 '+d.getDate()+'일 대본');
  if(title===null) return;
  const id=newId(), now=new Date().toISOString();
  const post={id, title:title.trim()||'제목 없음', created:now, updated:now, messages:[]};
  try{
    setStatusSafe('saving','만드는 중…');
    await putJson(postPath(id), post, null, 'new: '+post.title);
    await syncIndex(post);
    location.hash='#/p/'+id;
  }catch(e){ toast('생성 실패: '+e.message); }
}
function setStatusSafe(k,t){try{setStatus(k,t)}catch(_){}}

/* ================= 푸시 알림 ================= */
function pushSupported(){return 'serviceWorker' in navigator && 'PushManager' in window && typeof Notification!=='undefined';}
async function updateBell(){
  const b=$('#bellBtn'); if(!b) return;
  try{
    if(!pushSupported()){b.classList.remove('on');return;}
    const reg=await navigator.serviceWorker.ready;
    const sub=await reg.pushManager.getSubscription();
    b.classList.toggle('on', !!sub && Notification.permission==='granted');
  }catch(_){b.classList.remove('on');}
}
async function toggleNotify(){
  if(!pushSupported()){
    toast('이 브라우저는 알림을 지원하지 않습니다. 아이폰은 홈 화면에 설치한 앱에서만 가능합니다.');
    return;
  }
  try{
    const reg=await navigator.serviceWorker.ready;
    let sub=await reg.pushManager.getSubscription();
    if(sub){
      await sub.unsubscribe();
      try{
        const p=`data/push/${deviceId()}.json`;
        const cur=await getJson(p);
        if(cur) await gh(p,{method:'DELETE',body:{message:'push: unsubscribe',sha:cur.sha,branch:CFG.branch}});
      }catch(_){}
      toast('알림을 껐습니다 🔕'); updateBell(); return;
    }
    const name=await askText('기기 이름 — "일개미" 또는 "불개미"를 넣으면 상대방 대사만 알림이 와요','일개미 폰');
    if(name===null) return;
    const perm=await Notification.requestPermission();
    if(perm!=='granted'){toast('알림 권한이 거부되었습니다 — 브라우저 설정에서 허용해주세요');return;}
    sub=await reg.pushManager.subscribe({userVisibleOnly:true, applicationServerKey:urlB64ToUint8(CFG.vapidPublicKey)});
    const p=`data/push/${deviceId()}.json`;
    const cur=await getJson(p).catch(()=>null);
    await putJson(p,{id:deviceId(),name:(name.trim()||'기기'),sub:sub.toJSON()},cur&&cur.sha,'push: subscribe '+(name.trim()||'기기'));
    toast('알림이 켜졌습니다 🔔 상대방 대사가 오면 알려드려요');
    updateBell();
  }catch(e){toast('알림 설정 실패: '+e.message);}
}

/* ================= 화면: 채팅(대본) ================= */
async function openPost(id){
  stopPoll();
  editingId=null; menuId=null;
  app.innerHTML = `
  <div class="top">
    <button class="back" id="backBtn">‹</button>
    <div class="ttl" id="postTitle">불러오는 중…</div>
    <button class="edit-title" id="renameBtn" title="제목 수정">✎</button>
    <button class="del-post" id="delPostBtn" title="대본 삭제">🗑</button>
    <span class="status" id="status"></span>
  </div>
  <div class="chat" id="chatArea"></div>
  <div class="composer">
    <div class="roles">
      <button id="roleWorker" title="일개미"><img src="assets/ant-worker.png" alt="일개미"></button>
      <button id="roleFire" title="불개미"><img src="assets/ant-fire.png" alt="불개미"></button>
    </div>
    <textarea id="msgInput" rows="1" placeholder="대사를 입력하세요"></textarea>
    <button class="send" id="sendBtn" disabled>➤</button>
  </div>`;
  $('#backBtn').onclick = ()=>{location.hash='#/';};
  $('#renameBtn').onclick = renameCur;
  $('#delPostBtn').onclick = deleteCurPost;

  // 역할 토글
  let role = localStorage.getItem('antRole')||'worker';
  const drawRole=()=>{ $('#roleWorker').classList.toggle('on',role==='worker'); $('#roleFire').classList.toggle('on',role==='fire'); };
  $('#roleWorker').onclick=()=>{role='worker';localStorage.setItem('antRole',role);drawRole();$('#msgInput').focus();};
  $('#roleFire').onclick=()=>{role='fire';localStorage.setItem('antRole',role);drawRole();$('#msgInput').focus();};
  drawRole();

  // 입력창
  const inp=$('#msgInput'), sendBtn=$('#sendBtn');
  inp.addEventListener('input',()=>{
    sendBtn.disabled=!inp.value.trim();
    inp.style.height='auto'; inp.style.height=Math.min(inp.scrollHeight,132)+'px';
  });
  inp.addEventListener('keydown',e=>{
    if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();if(!sendBtn.disabled)send();}
  });
  sendBtn.onclick=send;
  async function send(){
    const text=inp.value.trim(); if(!text)return;
    inp.value=''; inp.style.height='auto'; sendBtn.disabled=true;
    // 낙관적 렌더
    const m={id:newId(), role, text, ts:new Date().toISOString(), dev:deviceId()};
    if(curPost){curPost.data.messages.push(m); renderChat();}
    try{ await mutatePost(id, p=>{ if(!p.messages.some(x=>x.id===m.id)) p.messages.push(m); }, 'msg: '+CFG.roles[role].name); renderChat(); }
    catch(_){ /* 상태표시가 알림 */ }
  }

  // 첫 로드
  try{
    const got = await getJson(postPath(id));
    if(!got){ $('#chatArea').innerHTML='<div class="day"><span>대본을 찾을 수 없습니다</span></div>'; return; }
    curPost = {id, data:got.data};
    $('#postTitle').textContent = got.data.title;
    renderChat(true);
    startPoll(id);
  }catch(e){ $('#chatArea').innerHTML=`<div class="day"><span>${esc(e.message)}</span></div>`; }
}

function renderChat(scrollEnd){
  if(!curPost) return;
  const area=$('#chatArea'); if(!area) return;
  const atBottom = scrollEnd || (area.scrollHeight-area.scrollTop-area.clientHeight < 120);
  let html='', lastDay='';
  for(const m of curPost.data.messages){
    const day=(m.ts||'').slice(0,10);
    if(day!==lastDay){html+=`<div class="day"><span>${fmtDay(m.ts)}</span></div>`;lastDay=day;}
    if(m.deleted){
      html+=`<div class="gone"><button data-restore="${esc(m.id)}">🗑 삭제된 메시지 — 복구하기</button></div>`;
      continue;
    }
    const r=CFG.roles[m.role]||CFG.roles.worker;
    const isEdit = editingId===m.id, isMenu = menuId===m.id;
    html+=`
    <div class="row ${m.role==='fire'?'fire':''}" data-mid="${esc(m.id)}">
      <img class="avatar" src="${r.img}" alt="${r.name}">
      <div class="mcol">
        <div class="who">${r.name}</div>
        ${isEdit?`
        <div class="editbox">
          <textarea id="editTa">${esc(m.text)}</textarea>
          <div class="actions"><button class="ok" data-saveedit="${esc(m.id)}">저장</button><button data-canceledit="1">취소</button></div>
        </div>`:`
        <div class="bwrap">
          <div class="bubble" data-bub="${esc(m.id)}">${esc(m.text)}</div>
          <div class="tstamp">${fmtTime(m.ts)}</div>
        </div>
        ${m.editedAt?'<div class="edited">수정됨</div>':''}
        ${isMenu?`<div class="actions"><button data-edit="${esc(m.id)}">✏️ 수정</button><button class="danger" data-del="${esc(m.id)}">🗑 삭제</button><button data-closemenu="1">✕</button></div>`:''}`}
      </div>
    </div>`;
  }
  if(!curPost.data.messages.length) html='<div class="day"><span>첫 대사를 입력해보세요 🐜</span></div>';
  area.innerHTML=html;
  if(atBottom) area.scrollTop=area.scrollHeight;
  if(editingId){const ta=$('#editTa');if(ta){ta.focus();ta.style.height='auto';ta.style.height=ta.scrollHeight+'px';}}
}

/* 채팅 영역 이벤트 위임 */
document.addEventListener('click', async e=>{
  const id = curPost && curPost.id; if(!id) return;
  const t=e.target;
  if(t.dataset.bub){ menuId = (menuId===t.dataset.bub)?null:t.dataset.bub; editingId=null; renderChat(); return; }
  if(t.dataset.closemenu){ menuId=null; renderChat(); return; }
  if(t.dataset.edit){ editingId=t.dataset.edit; menuId=null; renderChat(); return; }
  if(t.dataset.canceledit){ editingId=null; renderChat(); return; }
  if(t.dataset.saveedit){
    const mid=t.dataset.saveedit, txt=$('#editTa').value.trim();
    if(!txt){toast('내용이 비어 있습니다');return;}
    editingId=null;
    await mutatePost(id,p=>{const m=p.messages.find(x=>x.id===mid);if(m&&m.text!==txt){m.text=txt;m.editedAt=new Date().toISOString();}},'edit msg').catch(()=>{});
    renderChat(); return;
  }
  if(t.dataset.del){
    const mid=t.dataset.del; menuId=null;
    await mutatePost(id,p=>{const m=p.messages.find(x=>x.id===mid);if(m)m.deleted=true;},'del msg').catch(()=>{});
    renderChat(); return;
  }
  if(t.dataset.restore){
    const mid=t.dataset.restore;
    await mutatePost(id,p=>{const m=p.messages.find(x=>x.id===mid);if(m)delete m.deleted;},'restore msg').catch(()=>{});
    renderChat(); return;
  }
});

async function deleteCurPost(){
  if(!curPost) return;
  const ok=await askConfirm(`"${curPost.data.title}" 대본을 삭제할까요?\n삭제해도 기록은 남아 있어 복구를 요청할 수 있습니다.`);
  if(!ok) return;
  setStatus('saving','삭제 중…');
  try{
    const p=postPath(curPost.id);
    const cur=await getJson(p);
    if(cur) await gh(p,{method:'DELETE',body:{message:'del post: '+curPost.data.title,sha:cur.sha,branch:CFG.branch}});
    const delId=curPost.id;
    await mutate('data/index.json',d=>{d.posts=(d.posts||[]).filter(x=>x.id!==delId);},'index: del post',{posts:[]});
    toast('대본을 삭제했습니다');
    location.hash='#/';
  }catch(e){setStatus('error','삭제 실패');toast('삭제 실패: '+e.message);}
}
async function renameCur(){
  if(!curPost) return;
  const t=await askText('제목 수정', curPost.data.title);
  if(t===null||!t.trim()) return;
  await mutatePost(curPost.id,p=>{p.title=t.trim();},'rename').catch(()=>{});
  $('#postTitle').textContent=curPost.data.title;
}

/* ================= 폴링(다른 기기 준실시간 동기화) =================
   3.5초 간격 + ETag 조건부 요청 — 변경 없으면 304로 응답하며
   GitHub 호출 한도에 계산되지 않아 상시 폴링해도 무료 한도에 부담 없음 */
const etags = {};
async function pollJson(path){
  const r = await fetch(`${CFG.api}/repos/${CFG.dataRepo}/contents/${path}?ref=${CFG.branch}`,{
    cache:'no-store',
    headers: Object.assign({Authorization:'Bearer '+TOKEN, Accept:'application/vnd.github+json'},
                           etags[path]?{'If-None-Match':etags[path]}:{})
  });
  if(r.status===304) return null;              // 변경 없음
  if(r.status===401){sessionStorage.removeItem('gh_t');TOKEN=null;route();return null;}
  if(!r.ok) return null;
  etags[path]=r.headers.get('ETag');
  const j=await r.json();
  return {data: JSON.parse(utf8dec(b64decBytes(j.content))), sha:j.sha};
}
function applyPolled(id, got){
  if(got && curPost && curPost.id===id && JSON.stringify(got.data)!==JSON.stringify(curPost.data)){
    curPost={id,data:got.data};
    const t=$('#postTitle'); if(t) t.textContent=got.data.title;
    renderChat();
  }
}
function startPoll(id){
  stopPoll();
  pollTimer=setInterval(async()=>{
    if(document.hidden||editingId) return;
    try{ applyPolled(id, await pollJson(postPath(id))); }catch(_){}
  },3500);
}
function stopPoll(){if(pollTimer){clearInterval(pollTimer);pollTimer=null;}}
document.addEventListener('visibilitychange',()=>{
  if(!document.hidden && curPost && !editingId){
    pollJson(postPath(curPost.id)).then(got=>applyPolled(curPost.id, got)).catch(()=>{});
  }
});

function route(){
  if(!TOKEN){renderLock();return;}
  const h=location.hash;
  if(h.startsWith('#/p/')) openPost(h.slice(4));
  else renderBoard();
}
window.addEventListener('hashchange',route);
route();
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{});}
